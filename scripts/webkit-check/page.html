<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<!--
  The page `npm run webkit-check` loads in WebKit and Chromium: the built card
  with invented values, and window.check(), which measures what WebKit has got
  wrong before (issue #7 and the ring's sizing) - see scripts/webkit-check.mjs.
-->
<style>
  html, body { margin: 0; background: #fff; font: 15px/1.5 system-ui, sans-serif; }
  #frame { margin: 12px; transform-origin: 0 0; }
  #host { width: 600px; }
  :root {
    --ha-card-background:#fff; --card-background-color:#fff; --primary-text-color:#212121;
    --secondary-text-color:#727272; --divider-color:rgba(127,127,127,.3); --primary-color:#03a9f4;
    --energy-solar-color:#ff9800; --energy-grid-consumption-color:#488fc2;
    --energy-grid-return-color:#8353d1; --energy-battery-in-color:#f06292;
    --energy-battery-out-color:#4db6ac; --error-color:#db4437; --text-primary-color:#fff;
  }
</style>
<script>
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback(){ this.style.display="block"; this.style.background="var(--ha-card-background)";
      this.style.borderRadius="12px"; }
  });
  // No network: an icon is an empty box of the size Home Assistant gives it.
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback(){ this.style.display="inline-block";
      this.style.width = this.style.height = "var(--mdc-icon-size, 24px)"; }
  });
  // Another build can be checked against this one, e.g. a release before a
  // fix. Written as a tag while the page is parsed: Chromium's virtual clock
  // (--virtual-time-budget) does not wait for a dynamic import().
  const bundle = new URLSearchParams(location.search).get("bundle") ?? "../../dist/enerlens-card.js";
  document.write(`<script type="module" src="${bundle.replace(/"/g, "&quot;")}"><\/script>`);
</script>
</head><body><div id="frame"><div id="host"></div></div><pre id="out"></pre>
<script type="module">
addEventListener("error", (e) => { document.getElementById("out").textContent = JSON.stringify({ error: e.message }); });

/* plain: the card as it stands. scaled: inside an element scaled to 80 %, as
 * card-mod or an opening dialog does - WebKit's getScreenCTM() leaves that
 * scale out, which fooled the first fix for issue #7. below: the list under
 * the cross, in a narrow column. */
const params = new URLSearchParams(location.search);
const scene = params.get("scene") ?? "plain";
if (scene === "scaled") document.getElementById("frame").style.transform = "scale(0.8)";
if (scene === "below") document.getElementById("host").style.width = "400px";
// extras: the card as it stands on a dashboard column, with extra values (Z-1)
// whose prefixes are long enough to make the labels lean and shorten (Z-3).
// nobatt: the same without a battery, where grid and house labels may reach
// to the middle between them (Z-3).
if (scene === "extras" || scene === "nobatt") document.getElementById("host").style.width = "486px";
// clear: the card made transparent the way the README shows with card-mod
// (issue #8), without the ring, so nothing but the fill could hide a line
// end inside the house. Nothing may show inside a circle then (K-16).
// clearring: the same with the ring, whose gaps must not show a line either.
// clearlate: as clear, but made transparent the way card-mod does it - after
// the card has drawn and measured, with no re-render of its own and no state
// update after it: the fill's own change has to make the card measure (K-16).
const clear = scene === "clear" || scene === "clearring" || scene === "clearlate";
// right, left, triangle, trianglebatt: the other arrangements (AN-1, AN-5), with several PV
// sources and their rows and fan (PV-7) - at 640 px, so square_left has its PV
// rows on the left (AN-3). quick: every quick button expanded, compact, on a
// phone (QB-9 to QB-14).
const LAYOUT = { right: "square_right", left: "square_left", triangle: "triangle", trianglebatt: "triangle_battery", quick: "cross" }[scene];
if (LAYOUT) document.getElementById("host").style.width = scene === "quick" ? "380px" : "640px";
const ringOff = scene === "clear" || scene === "clearlate";

const W = (id, w) => [id, { entity_id: id, state: String(w),
  attributes: { unit_of_measurement: "W", device_class: "power" }, last_changed: "", last_updated: "" }];
const states = Object.fromEntries([
  W("sensor.s", 6000), W("sensor.g", 1500), W("sensor.h", 4500), W("sensor.b", -3000),
  W("sensor.c1", 2400), W("sensor.c2", 1200), W("sensor.c3", 600),
  W("sensor.pv1", 3500), W("sensor.pv2", 1800), W("sensor.pv3", 700),
  // Extra values (Z-1): a figure in the PV circle, and a label field at every
  // node, wide enough to need the room and the width limits of Z-3 and Z-8.
  ["sensor.today", { entity_id: "sensor.today", state: "12.4", attributes: { unit_of_measurement: "kWh" }, last_changed: "", last_updated: "" }],
  ["sensor.share", { entity_id: "sensor.share", state: "82", attributes: { unit_of_measurement: "%" }, last_changed: "", last_updated: "" }],
]);

await customElements.whenDefined("enerlens-card");
const card = document.createElement("enerlens-card");
card.setConfig({
  type: "custom:enerlens-card", title: "Energie",
  entities: scene === "nobatt"
    ? { solar: "sensor.s", grid: "sensor.g", house: "sensor.h" }
    : LAYOUT
      ? { solar: [
            { entity: "sensor.pv1", name: "Dach", kwp: 8 },
            { entity: "sensor.pv2", name: "West", kwp: 4 },
            { entity: "sensor.pv3", name: "Balkon", kwp: 1 },
          ], grid: "sensor.g", house: "sensor.h", battery: "sensor.b" }
      : { solar: "sensor.s", grid: "sensor.g", house: "sensor.h", battery: "sensor.b" },
  // "right" carries a list title wider than any row: it must not widen the
  // rows' shared column (PV-7).
  ...(LAYOUT ? { layout: LAYOUT, list: { solar: true, ...(scene === "right" ? { title: "Alle Verbraucher und PV-Quellen dieses Hauses" } : {}) } } : {}),
  ...(scene === "quick" ? { view: {
    energy_periods: ["power"], quick_style: "segment_compact",
    expanded: ["modes", "pv_scales", "scope"], remember: false,
  } } : {}),
  consumers: [
    { entity: "sensor.c1", name: "Wärmepumpe", icon: "mdi:heat-wave", highlight: { bold: true, band: true } },
    // Ring, both bars and the fill of an icon (L-20): nothing may leave the card.
    { entity: "sensor.c2", name: "Waschmaschine", icon: "mdi:washing-machine",
      indicators: { ring: { entity: "sensor.share" }, bar_top: { entity: "sensor.share" },
        bar_bottom: { entity: "sensor.share" }, fill: { entity: "sensor.share" } } },
    { entity: "sensor.c3", name: "Klima", icon: "mdi:air-conditioner" },
  ],
  flow: { min_w: 20, peak_w: 8000 },
  ...(scene === "extras" || scene === "nobatt" ? { nodes: {
    solar: { inside: { entity: "sensor.today" }, label: { entity: "sensor.today", prefix: "Prognose" } },
    grid: { label: { entity: "sensor.today", prefix: "Netzbezug heute" } },
    house: { label: { entity: "sensor.share", prefix: "Autarkie heute" } },
    // No state word below the battery: more room above than below, which is
    // what moves the list off the house's height if nothing makes up for it.
    battery: { show_state: false, label: { entity: "sensor.today", prefix: "Rest" } },
  } } : {}),
  ...(scene === "below" ? { list: { always_below: true } } : {}),
  ...(ringOff ? { ring: { enabled: false } } : {}),
});
card.hass = { states, locale: { language: "de", number_format: "language" }, language: "de", callWS: async () => ({}) };
document.getElementById("host").appendChild(card);
if (clear) {
  await card.updateComplete;
  const transparent = () =>
    card.shadowRoot.querySelector("ha-card").style.setProperty("--ha-card-background", "transparent");
  if (scene === "clearlate") setTimeout(transparent, 800);
  else transparent();
}

const NS = "http://www.w3.org/2000/svg";
const centre = (el) => {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
};

/** Distance from p to the segment a-b. */
function toSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
  return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy);
}

/**
 * How far the dots in `svg` are from the drawn lines, in screen pixels. Each
 * line is sampled into marks measured as boxes - the same way the dots are, so
 * a transform above the card treats both alike - and every dot is put at three
 * places along its path. The worst distance counts.
 */
function offLines(svg, dotSelector, lineSelector) {
  if (!svg) return { dots: 0, worst: 0 };
  const lines = [...svg.querySelectorAll(lineSelector)];
  const marks = document.createElementNS(NS, "g");
  marks.style.visibility = "hidden";
  const sampled = lines.map((line) => {
    const length = line.getTotalLength();
    const steps = Math.max(2, Math.ceil(length / 2));
    return Array.from({ length: steps + 1 }, (_, i) => {
      const at = line.getPointAtLength((length * i) / steps);
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", at.x); c.setAttribute("cy", at.y); c.setAttribute("r", "1");
      marks.appendChild(c);
      return c;
    });
  });
  svg.appendChild(marks);
  const polylines = sampled.map((cs) => cs.map(centre));
  marks.remove();
  let worst = 0, dots = 0;
  for (const dot of svg.querySelectorAll(dotSelector)) {
    if (!dot.firstChild) continue;
    dots++;
    for (const share of [15, 50, 85]) {
      dot.style.offsetDistance = `${share}%`;
      const p = centre(dot);
      let nearest = Infinity;
      for (const pts of polylines) {
        for (let i = 1; i < pts.length; i++) nearest = Math.min(nearest, toSegment(p, pts[i - 1], pts[i]));
      }
      worst = Math.max(worst, nearest);
    }
  }
  return { dots, worst: +worst.toFixed(2) };
}

/**
 * Label blocks against everything they must leave alone (Z-8): the card's
 * edge, the header with the mode chips, and every other node's circle.
 */
function labels(root) {
  const card = root.querySelector("ha-card").getBoundingClientRect();
  const header = root.querySelector(".header")?.getBoundingClientRect();
  const out = [];
  const circle = (node) => {
    const r = node.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width / 2 };
  };
  for (const node of root.querySelectorAll(".node")) {
    const label = node.querySelector(".label");
    if (!label) continue;
    const key = [...node.classList].find((c) => ["solar", "grid", "house", "battery"].includes(c));
    const b = label.getBoundingClientRect();
    if (b.top < card.top - 1 || b.bottom > card.bottom + 1) out.push(`${key}: Beschriftung ragt aus der Karte`);
    // Sideways Z-3 asks for 8 px of air; one pixel of rounding is allowed.
    if (b.left < card.left + 7 || b.right > card.right - 7) out.push(`${key}: Beschriftung zu nah am Kartenrand`);
    if (header && b.top < header.bottom - 1 && b.left < header.right && header.left < b.right) {
      out.push(`${key}: Beschriftung unter den Chips`);
    }
    for (const other of root.querySelectorAll(".node")) {
      if (other === node) continue;
      const c = circle(other);
      const nx = Math.max(b.left, Math.min(c.x, b.right));
      const ny = Math.max(b.top, Math.min(c.y, b.bottom));
      // Z-3 asks for 8 px of air; one pixel of rounding is allowed.
      if (Math.hypot(nx - c.x, ny - c.y) < c.r + 7) out.push(`${key}: Beschriftung zu nah am Nachbarkreis`);
    }
  }
  // Grid and house labels side by side keep 8 px apart (Z-3, without a battery).
  const grid = root.querySelector(".node.grid .label")?.getBoundingClientRect();
  const home = root.querySelector(".node.house .label")?.getBoundingClientRect();
  if (grid && home && grid.bottom > home.top && home.bottom > grid.top && home.left - grid.right < 7) {
    out.push(`Netz- und Haus-Beschriftung ${(home.left - grid.right).toFixed(1)} px auseinander`);
  }
  // Beside the drawing each block stands level with its node - the consumers
  // with the house, the PV rows with PV - as far as the drawing allows: it
  // may stop at the drawing's edge or at the other block (L-1, Z-8, L-17).
  // Together taller than the drawing, the blocks stand as laid out.
  const cross = root.querySelector(".cross")?.getBoundingClientRect();
  const blocks = [
    [root.querySelector(".rows"), root.querySelector(".node.house"), "Verbraucher"],
    [root.querySelector(".pv-rows"), root.querySelector(".node.solar"), "PV-Zeilen"],
  ].filter(([b]) => b);
  const tall = blocks.reduce((sum, [b]) => sum + b.getBoundingClientRect().height, 0) + 10;
  if (cross && !root.querySelector(".body.stacked") && tall <= cross.height) {
    const boxes = blocks.map(([b]) => b.getBoundingClientRect());
    blocks.forEach(([block, node, name], i) => {
      const l = boxes[i], n = node.getBoundingClientRect();
      const off = l.top + l.height / 2 - (n.top + n.height / 2);
      const near = (a, b) => Math.abs(a - b) <= 2;
      const stopped =
        near(l.top, cross.top) || near(l.bottom, cross.bottom) ||
        boxes.some((o, j) => j !== i && (Math.abs(o.bottom - l.top) <= 12 || Math.abs(l.bottom - o.top) <= 12));
      if (Math.abs(off) > 2 && !stopped) out.push(`${name} ${off.toFixed(1)} px neben ihrem Knoten`);
    });
  }
  // PV rows and consumers in one list share their columns (PV-7): marks,
  // names and values of both blocks stand one below the other.
  const pv = root.querySelector(".list:not(.pv-side) .pv-rows");
  if (pv && pv.parentElement.querySelector(".rows")) {
    for (const [sel, side, what] of [[".swatch", "left", "Marken"], [".name", "left", "Namen"], [".row-value", "right", "Werte"]]) {
      const xs = [...pv.parentElement.querySelectorAll(`.pv-rows .row ${sel}, .rows .row ${sel}`)].map((e) => e.getBoundingClientRect()[side]);
      const spread = Math.max(...xs) - Math.min(...xs);
      if (spread > 1) out.push(`${what} der PV-Zeilen und Verbraucher ${spread.toFixed(1)} px versetzt`);
    }
    // The longest name decides the width: at least one name fills its room.
    const slack = Math.min(...[...pv.parentElement.querySelectorAll(".row .name")].map((n) => n.clientWidth - n.scrollWidth));
    if (slack > 1) out.push(`Spalte ${slack} px breiter als der längste Name`);
  }
  return out;
}

/** Elements that reach outside the card by more than a pixel. */
function outside(root) {
  const card = root.querySelector("ha-card").getBoundingClientRect();
  const out = [];
  for (const el of root.querySelectorAll(".node, .row, svg.ring, g.dot, g.fan-dot")) {
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) continue;
    if (r.left < card.left - 1 || r.top < card.top - 1 || r.right > card.right + 1 || r.bottom > card.bottom + 1) {
      out.push(el.getAttribute("class"));
    }
  }
  return out;
}

/* The lines' width against what the card asked for (K-12): 3 px and 2 px
 * times --el-line-k. Read from the computed style, which WebKit reports
 * divided by its page zoom - builds before the sizing did the same - so
 * webkit-check.mjs only weighs it for runs it started unzoomed. */
function lineWidths(root) {
  const s = parseFloat(card.style.getPropertyValue("--el-scale"));
  const k = parseFloat(card.style.getPropertyValue("--el-line-k")) || 1;
  const link = root.querySelector("path.link");
  const fan = root.querySelector("path.fan-line");
  if (!link || !fan || !s) return { error: "keine Linien" };
  const width = (el) => parseFloat(getComputedStyle(el).strokeWidth);
  const off = Math.max(Math.abs(width(link) * s - 3 * k), Math.abs(width(fan) - 2 * k));
  return { off: +off.toFixed(3) };
}

/** From each node of the cross towards its middle, where its lines arrive. */
const TOWARDS = { solar: [0, 1], grid: [1, 0], house: [-1, 0], battery: [0, -1] };

/**
 * The direction a line of `node` leaves it in. The cross keeps its fixed
 * directions; the other arrangements (AN-1) take the line drawn nearest to
 * the node: from its end at the circle a few units along it.
 */
function towards(node, root, key) {
  if (!LAYOUT || LAYOUT === "cross") return TOWARDS[key];
  const svg = root.querySelector(".plot svg");
  const ctm = svg.getScreenCTM();
  const screen = (p) => ({ x: ctm.a * p.x + ctm.c * p.y + ctm.e, y: ctm.b * p.x + ctm.d * p.y + ctm.f });
  const n = centre(node);
  let best;
  for (const path of svg.querySelectorAll("path.link")) {
    const len = path.getTotalLength();
    for (const [at, step] of [[0, 6], [len, len - 6]]) {
      const end = screen(path.getPointAtLength(at));
      const d = Math.hypot(end.x - n.x, end.y - n.y);
      if (!best || d < best.d) best = { d, end, next: screen(path.getPointAtLength(step)) };
    }
  }
  const dx = best.next.x - n.x, dy = best.next.y - n.y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}

/**
 * For the pictures webkit-check.mjs takes (K-16): each circle's centre, outer
 * radius, the direction its lines come from, and how far in nothing but the
 * page may show - within the border, or within the ring where there is one.
 * CSS pixels, with the viewport width to scale them onto the picture. In the
 * clear scenes every dot of the cross also stands once at each end of its
 * path, and the fan's dots at their start on the house.
 */
function rims(root) {
  if (clear) {
    for (const dot of root.querySelectorAll(".plot svg g.dot")) {
      if (!dot.firstChild) continue;
      const twin = dot.cloneNode(true);
      dot.style.offsetDistance = "0%";
      twin.style.offsetDistance = "100%";
      dot.after(twin);
    }
    for (const dot of root.querySelectorAll("svg.fan g.fan-dot")) dot.style.offsetDistance = "0%";
  }
  return {
    view: innerWidth,
    nodes: [...root.querySelectorAll(".node")].map((node) => {
      const b = node.getBoundingClientRect();
      const key = [...node.classList].find((c) => ["solar", "grid", "house", "battery"].includes(c));
      let inner = b.width / 2 - parseFloat(getComputedStyle(node).borderTopWidth);
      const ring = node.querySelector("svg.ring");
      const seg = ring?.querySelector(".ring-seg");
      if (seg) {
        const r = +seg.getAttribute("r"), sw = +seg.getAttribute("stroke-width");
        inner = Math.min(inner, ((r - sw / 2) / 100) * ring.getBoundingClientRect().width);
      }
      return { key, x: b.left + b.width / 2, y: b.top + b.height / 2, outer: b.width / 2, inner, towards: towards(node, root, key) };
    }),
  };
}

window.check = () => {
  const root = card.shadowRoot;
  // Dots stop where they are told: no animation may move them while measured.
  for (const a of root.getAnimations()) {
    if (a.effect?.getTiming?.().iterations === Infinity) a.cancel();
  }
  const house = root.querySelector(".node.house");
  const ring = root.querySelector(".node.house svg.ring");
  const h = house && centre(house), r = ring && centre(ring);
  const result = {
    vendor: navigator.vendor,
    zoom: card._pathZoom,
    cross: offLines(root.querySelector(".plot svg"), "g.dot", "path.link"),
    fan: offLines(root.querySelector("svg.fan:not(.pv-fan)"), "g.fan-dot", "path.fan-line"),
    // The PV rows' own fan (PV-7), where there are PV rows.
    pvfan: offLines(root.querySelector("svg.pv-fan"), "g.fan-dot", "path.fan-line"),
    ring: h && r ? +Math.hypot(h.x - r.x, h.y - r.y).toFixed(2) : null,
    outside: outside(root),
    labels: labels(root),
    lines: lineWidths(root),
  };
  result.rims = rims(root);
  // Cut out only where the circles let the lines show (K-16).
  result.clipped = !!root.querySelector(".plot svg [clip-path]");
  result.fanClipped = !!root.querySelector("svg.fan [clip-path]");
  result.clear = clear;
  result.scene = scene;
  result.ringOff = ringOff;
  return JSON.stringify(result);
};

// Chromium has no way to call in; it reads the answer out of the page.
if (location.hash === "#auto") {
  setTimeout(() => { document.getElementById("out").textContent = window.check(); }, 2500);
}
</script></body></html>
