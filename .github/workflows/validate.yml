# HACS validation. Deliberately not on every push: before the first release
# there is no built file in the tree, so the structure check would fail
# (REQ AL-3). Must pass without `ignore` from the first release on.
name: HACS

on:
  # The tag itself, because a release created by CI with the workflow token
  # does not fire `release: published` - GitHub suppresses workflow chains
  # started from that token on purpose.
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
