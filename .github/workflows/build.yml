name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report bundle size
        run: |
          SIZE=$(stat -c%s dist/enerlens-card.js)
          GZIP=$(gzip -c dist/enerlens-card.js | wc -c)
          echo "Bundle: $SIZE bytes, $GZIP bytes gzipped" >> "$GITHUB_STEP_SUMMARY"
      # The release page should say what changed in words, and those words are
      # already written - taking them from the changelog keeps one source.
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      # HACS reads real releases, not tags: attach exactly one asset (REQ AL-2).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/enerlens-card.js
          body_path: release-notes.md
          generate_release_notes: true
